name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops -d ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ops:ops@localhost:5432/ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "services/agent[dev]"
      - name: Ruff
        run: .venv/bin/ruff check services/agent
      - name: Tests
        run: .venv/bin/pytest -q -m "not persistence"
        working-directory: services/agent
      - name: Persistence tests
        env:
          AGENT_PERSISTENCE: postgres
        run: .venv/bin/pytest -q -m persistence
        working-directory: services/agent
      - name: Offline eval
        run: .venv/bin/python -m agentic_ops.evals.harness --provider fake

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
