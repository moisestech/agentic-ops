services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.agent
    environment:
      AGENT_PROVIDER: fake
      DATABASE_URL: postgresql://ops:ops@postgres:5432/ops
      AGENT_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_AGENT_URL: http://localhost:8080
      AGENT_URL: http://agent:8080
    ports:
      - "3000:3000"
    depends_on:
      - agent
