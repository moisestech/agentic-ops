<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="What the app does: brief, retrieve, tools, cite, pause, record">
  <title>What Agentic Ops does</title>
  <rect width="960" height="280" fill="#F4EFE6"/>
  <text x="32" y="36" fill="#6B645B" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">WHAT THIS APP DOES</text>
  <path d="M70 140 H890" fill="none" stroke="#10110F" stroke-width="1.5"/>
  <g font-family="Georgia, serif" font-size="12" fill="#10110F" text-anchor="middle">
    <g transform="translate(32,88)">
      <rect width="120" height="104" fill="#FFFDF8" stroke="#10110F"/>
      <text x="60" y="48">1 Brief</text>
      <text x="60" y="70" font-size="11" fill="#6B645B">question or</text>
      <text x="60" y="86" font-size="11" fill="#6B645B">program launch</text>
    </g>
    <g transform="translate(188,88)">
      <rect width="120" height="104" fill="#FFFDF8" stroke="#10110F"/>
      <text x="60" y="48">2 Retrieve</text>
      <text x="60" y="70" font-size="11" fill="#6B645B">approved files</text>
      <text x="60" y="86" font-size="11" fill="#6B645B">with source ids</text>
    </g>
    <g transform="translate(344,88)">
      <rect width="120" height="104" fill="#FFFDF8" stroke="#10110F"/>
      <text x="60" y="48">3 Tools</text>
      <text x="60" y="70" font-size="11" fill="#6B645B">calendar · budget</text>
      <text x="60" y="86" font-size="11" fill="#6B645B">writes stay locked</text>
    </g>
    <g transform="translate(500,88)">
      <rect width="120" height="104" fill="#FFFDF8" stroke="#10110F"/>
      <text x="60" y="48">4 Cite</text>
      <text x="60" y="70" font-size="11" fill="#6B645B">grounded draft</text>
      <text x="60" y="86" font-size="11" fill="#6B645B">or honest abstain</text>
    </g>
    <g transform="translate(656,88)">
      <rect width="120" height="104" fill="#FFFDF8" stroke="#9A3412"/>
      <text x="60" y="48">5 Pause</text>
      <text x="60" y="70" font-size="11" fill="#6B645B">human approve</text>
      <text x="60" y="86" font-size="11" fill="#6B645B">or reject</text>
    </g>
    <g transform="translate(812,88)">
      <rect width="120" height="104" fill="#B6E2BA" stroke="#10110F"/>
      <text x="60" y="48">6 Record</text>
      <text x="60" y="70" font-size="11" fill="#3F6212">internal audit</text>
      <text x="60" y="86" font-size="11" fill="#3F6212">never auto-email</text>
    </g>
  </g>
</svg>
