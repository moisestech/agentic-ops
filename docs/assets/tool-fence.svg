<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="READ tools are live. The WRITE tool stays locked until a person decides.">
  <title>READ / WRITE fence</title>
  <rect width="960" height="360" fill="#F4EFE6"/>
  <defs>
    <g id="icon-read" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round">
      <path d="M4 12 C7 7 17 7 20 12 C17 17 7 17 4 12 Z"/><circle cx="12" cy="12" r="2.2"/>
    </g>
    <g id="icon-write" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round">
      <rect x="7" y="11" width="10" height="8"/><path d="M9 11 V9 A3 3 0 0 1 15 9 V11"/>
    </g>
    <g id="icon-tools" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
      <rect x="4" y="4" width="16" height="16"/><path d="M9 15 L14 10"/><circle cx="15.5" cy="8.5" r="2"/>
    </g>
  </defs>
  <text x="32" y="36" fill="#6B645B" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">READ IS LIVE. WRITE STAYS PENDING_APPROVAL.</text>
  <use href="#icon-tools" x="32" y="52"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#1C1916">
    <g transform="translate(32,88)">
      <rect width="896" height="48" fill="#FFFDF8" stroke="#1C1916"/>
      <use href="#icon-read" x="16" y="12"/>
      <text x="56" y="30">search_documents</text>
      <text x="280" y="30" fill="#3F6212">READ</text>
      <text x="360" y="30" fill="#6B645B" font-family="Georgia, serif">RAG over the org corpus</text>
    </g>
    <g transform="translate(32,144)">
      <rect width="896" height="48" fill="#FFFDF8" stroke="#1C1916"/>
      <use href="#icon-read" x="16" y="12"/>
      <text x="56" y="30">check_calendar</text>
      <text x="280" y="30" fill="#3F6212">READ</text>
      <text x="360" y="30" fill="#6B645B" font-family="Georgia, serif">Staff capacity and windows</text>
    </g>
    <g transform="translate(32,200)">
      <rect width="896" height="48" fill="#FFFDF8" stroke="#1C1916"/>
      <use href="#icon-read" x="16" y="12"/>
      <text x="56" y="30">calculate_budget</text>
      <text x="280" y="30" fill="#3F6212">READ</text>
      <text x="360" y="30" fill="#6B645B" font-family="Georgia, serif">Line items versus the cap</text>
    </g>
    <g transform="translate(32,256)">
      <rect width="896" height="48" fill="#FFFDF8" stroke="#9A3412"/>
      <use href="#icon-write" x="16" y="12"/>
      <text x="56" y="30">manage_actions</text>
      <text x="280" y="30" fill="#9A3412">WRITE</text>
      <text x="360" y="30" fill="#6B645B" font-family="Georgia, serif">Internal task only. Locked until a human decides.</text>
    </g>
  </g>
  <text x="32" y="340" fill="#6B645B" font-family="Georgia, serif" font-size="13">The model may propose. It may not execute. No email. No calendar invite.</text>
</svg>
