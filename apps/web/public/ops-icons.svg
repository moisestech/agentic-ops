      <circle cx="15.5" cy="8.5" r="2"/>
    </g>
    <g id="icon-draft" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linecap="round">
      <path d="M6 8 V7 C6 5 8 5 8 7 V10"/>
      <path d="M11 8 V7 C11 5 13 5 13 7 V10"/>
      <path d="M5 16 H19"/>
    </g>
    <g id="icon-evaluate" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 6 V18"/>
      <path d="M5 9 H19"/>
      <path d="M6 9 V13 H10 V9"/>
      <path d="M14 9 V12 H18 V9"/>
    </g>
    <g id="icon-pause">
      <rect x="5" y="10" width="14" height="4" fill="#9A3412" stroke="#1C1916" stroke-width="1.75"/>
    </g>
    <g id="icon-record" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linecap="round">
      <rect x="4" y="5" width="16" height="5" fill="#B6E2BA" stroke="#1C1916" stroke-width="1.75"/>
      <path d="M4 14 H20 M4 19 H16"/>
    </g>
    <g id="icon-read" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round">
      <path d="M4 12 C7 7 17 7 20 12 C17 17 7 17 4 12 Z"/>
      <circle cx="12" cy="12" r="2.2"/>
    </g>
    <g id="icon-write" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round">
