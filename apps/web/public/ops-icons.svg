    </g>
    <g transform="translate(168,8)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-tools" x="24" y="16"/>
      <text x="36" y="64">tools</text>
    </g>
    <g transform="translate(248,8)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-draft" x="24" y="16"/>
      <text x="36" y="64">draft</text>
    </g>
    <g transform="translate(328,8)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-evaluate" x="24" y="16"/>
      <text x="36" y="64">evaluate</text>
    </g>
    <g transform="translate(408,8)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-pause" x="24" y="16"/>
      <text x="36" y="64">pause</text>
    </g>
    <g transform="translate(8,96)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-record" x="24" y="16"/>
      <text x="36" y="64">record</text>
    </g>
    <g transform="translate(88,96)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-read" x="24" y="16"/>
      <text x="36" y="64">read</text>
    </g>
    <g transform="translate(168,96)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-write" x="24" y="16"/>
      <text x="36" y="64">write</text>
    </g>
    <g transform="translate(248,96)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-state" x="24" y="16"/>
      <text x="36" y="64">state</text>
    </g>
    <g transform="translate(328,96)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-human" x="24" y="16"/>
      <text x="36" y="64">human</text>
    </g>
    <g transform="translate(408,96)">
      <rect width="72" height="72" fill="#FFFDF8" stroke="#D9D1C5"/>
      <use href="#icon-model" x="24" y="16"/>
