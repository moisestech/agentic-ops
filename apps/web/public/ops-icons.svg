<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 176" role="img" aria-label="Agentic Ops stage marks and lecture glyphs">
  <title>Agentic Ops icons</title>
  <rect width="480" height="176" fill="#F4EFE6"/>
  <defs>
    <g id="icon-brief" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
      <path d="M7 4 H14 L19 9 V20 H7 Z"/>
      <path d="M14 4 V9 H19"/>
    </g>
    <g id="icon-retrieve" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 6 H15 M5 11 H15 M5 16 H11"/>
      <path d="M14 14 L16 16.5 L20 12"/>
    </g>
    <g id="icon-tools" fill="none" stroke="#1C1916" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
      <rect x="4" y="4" width="16" height="16"/>
