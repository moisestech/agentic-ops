    </g>
    <g id="icon-state" fill="none" stroke="#1C1916" stroke-width="1.75">
      <ellipse cx="12" cy="7" rx="7" ry="3"/>
      <path d="M5 7 V17 C5 19 19 19 19 17 V7"/>
